# Homology Configuration

# Input/Output Configuration
io:
  input_dir: "results/layer_outputs"     # Directory containing layer output files
  output_dir: "results/homology"        # Directory for homology results
  input_pattern: "*.pt"                 # File pattern to match
  save_intermediate: false              # Save FPS points and distance matrices
  save_persistence_diagrams: false     # Save full persistence diagrams

# Sampling Configuration
sampling:
  use_fps: true                          # Enable/disable Furthest Point Sampling
  fps_num_points: 12000                      # Target number of points after FPS (reduced for witness complex)
  min_points_threshold: 50             # Minimum points required to perform homology
  adaptive_sampling: true              # Adjust sample size based on dataset size
  max_sample_ratio: 0.01               # Maximum fraction of original data to sample (1% for testing)
  normalization: false                # Normalize data along each dimension before FPS (disabled - normalization done in computation step)

# Distance Matrix Configuration  
distance:                     # "knn" (geodesic on k-NN graph) or "full" (Euclidean)
  k_neighbors: 35                # Number of nearest neighbors for k-NN graph construction
  metric: "euclidian"                  # Base metric for k-NN graph edges ("euclidean", "cosine", "manhattan")
  geodesic: true                       # Use geodesic distances on k-NN graph (always true for method="knn")            # "euclidean" (actual distances) or "uniform" (all edges = 1)          # Density threshold for graph connectivity warnings

# Homology Computation
computation:
  max_dimension: 1                # Maximum homology dimension (H0, H1, H2)
  max_edge_length: 3               # Maximum edge length for Vietoris-Rips complex (increased for integer distances)
  min_persistence: 0.0                # Minimum persistence value for features
  num_neighbors: 50                   # Number of neighbors (actively used for k-NN)
  normalize_data: false               # Normalize layer activations before processing (feature-wise z-score normalization)
  collapse_edges: false                # Use edge collapse optimization in Gudhi

# Witness Complex Configuration
witness_complex:
  # Landmark Configuration
  n_landmarks: 1000                       # Number of landmark points to select (optimized value: 50)
  landmark_selection: "random"           # Landmark selection method: "maxmin", "fps", or "random" (maxmin gives better topology coverage)
  adaptive_landmarks: true            # If true, adjust landmark count based on dataset size
  landmark_percentage: 0.005           # Percentage of points to use as landmarks when adaptive_landmarks=true
  min_landmarks: 20                    # Minimum number of landmarks when using adaptive sizing
  max_landmarks: 1000                   # Maximum number of landmarks when using adaptive sizing
  
  # Maxmin Algorithm Configuration
  maxmin_init_strategy: "center"       # Initialization strategy: "center", "corner", "pca", or "random"
  maxmin_add_noise: false              # Add small noise to break ties in maxmin selection
  maxmin_noise_scale: 1e-6             # Scale of noise when maxmin_add_noise is true
  
  # Witness Sampling Configuration  
  max_witnesses: 60000               # Maximum number of witnesses to use (sample if dataset larger)
  witness_sampling_method: "random"   # Method for sampling witnesses: "random" or "fps"
  use_witness_sampling: true           # Enable witness sampling for large datasets
  witness_threshold: 60000             # Sample witnesses if dataset has more than this many points
  
  # Complex Construction Parameters
  relaxation: 1                   # Relaxation parameter (nu) - 0 is strict, 1-2 allows more flexibility  
  max_alpha_square: 2          # Maximum squared distance for filtration (smaller = faster, inf = no limit)
  witness_type: "weak"                # Type of witness complex: "weak" or "strong"
  
  # Gudhi-specific Parameters
  limit_dimension: 2                  # Maximum dimension for simplex tree construction
  use_euclidean_witness: true         # Use EuclideanWitnessComplex (true) or manual construction (false)
  
  # Performance Tuning
  batch_size: 1000                    # Batch size for distance computations
  fallback_enabled: false             # Use fallback Betti estimation if Gudhi fails
  fallback_h0_ratio: 7                # H0 = landmarks // fallback_h0_ratio (fallback mode)
  fallback_h1_ratio: 10               # H1 = landmarks // fallback_h1_ratio (fallback mode)
  
  # Random Seed Configuration
  random_seed: 42                     # Random seed for reproducible results (null for random)

# Output Configuration
output:
  save_diagrams: true                # Save persistence diagrams
  save_betti: true                   # Save Betti numbers (main output)
  save_persistence: false            # Save full persistence data
  output_format: "pytorch"           # "pytorch" (.pt) or "numpy" (.npz)
  compress_output: true              # Compress output files

# Parallel Processing Configuration
parallel:
  enabled: true                     # Enable parallel processing
  num_workers: 4                # Number of workers (null for auto-detection)
  chunk_size: 1                      # Tasks per worker batch
  timeout_per_task: 300              # Timeout per task in seconds (5 minutes)
  method: "concurrent_futures"       # Parallel processing method
  memory_limit_gb: 50.0             # Memory limit for parallel processing

# Logging and Monitoring
logging:
  level: "WARNING"                   # Logging level (reduced verbosity)
  save_logs: true                    # Save logs to file
  progress_bar: true                 # Show progress bars
  profile_performance: false         # Enable performance profiling
