# Decision Boundary Topology Tracking Configuration
# This configuration controls the extraction and analysis of decision boundaries during neural network training

# Training Integration Settings
training:
  # When to extract decision boundaries during training
  extraction_schedule:
    enabled: true                    # Enable decision boundary extraction
    frequency: 5                    # Extract every N epochs
    start_epoch: 0                   # Start extraction from this epoch
    end_epoch: null                  # Stop extraction at this epoch (null = until end)
    final_extraction: true           # Always extract at final epoch
  
  # Model checkpoint integration
  checkpoint_integration:
    save_with_boundaries: true       # Save boundary data with model checkpoints
    boundary_data_dir: 'results/decision_boundaries'  # Directory for boundary data

# Boundary Extraction Settings
extraction:
  # Spatial sampling grid for boundary detection
  grid:
    resolution: [100, 100, 100]         # Grid resolution [x, y, z]
    bounds: null                     # Auto-detect from training data if null
    custom_bounds:                   # Custom bounds if not auto-detected
      x_min: -20.0
      x_max: 20.0
      y_min: -20.0
      y_max: 20.0
      z_min: -20.0
      z_max: 20.0
  
  # Decision boundary detection
  boundary_detection:
    threshold: 0.5                   # Decision threshold (f(x) = threshold)
    tolerance: 0.01                  # Tolerance for boundary detection |f(x) - threshold| < tolerance
    min_points: 100                  # Minimum points required for valid boundary
    
  # Isosurface extraction (marching cubes)
  isosurface:
    enabled: true                    # Enable isosurface extraction
    level: 0.5                       # Isosurface level (decision threshold)
    smoothing: 0                     # Gaussian smoothing sigma (0 = no smoothing)
    decimate: 0.1                    # Mesh decimation factor (0.1 = reduce by 10%, keep 90% of faces)
    
  # Point cloud sampling near boundary
  point_sampling:
    enabled: true                    # Enable point cloud sampling
    method: 'uniform'               # 'uniform', 'adaptive', 'random'
    num_points: 100000                 # Target number of boundary points
    adaptive_refinement: true        # Refine sampling in complex regions
    
# Topology Computation Settings
topology:
  # Homology computation parameters
  computation:
    enabled: false                   # Disable during training - compute separately with compute_boundary_homology.py
    max_dimension: 2                 # Maximum homology dimension
    max_edge_length: 3.0             # Maximum edge length for Rips complex
    normalize_data: true             # Normalize point cloud before computation
    
  # Sampling for topology computation
  sampling:
    method: 'fps'                    # 'fps' (farthest point), 'random', 'grid'
    num_points: 10000                 # Points for topology computation
    min_points_threshold: 100        # Minimum points required
    
  # Persistence computation
  persistence:
    filtration_type: 'rips'          # 'rips', 'alpha', 'cech'
    compute_persistence_images: false # Compute persistence images
    
# Visualization Settings
visualization:
  # 3D boundary visualization
  boundary_viz:
    enabled: true                    # Enable 3D boundary visualization
    backend: 'plotly'                # 'plotly', 'matplotlib', 'trimesh'
    show_mesh: true                  # Show isosurface mesh
    show_points: true                # Show boundary point cloud
    opacity: 0.7                     # Mesh opacity
    point_size: 2                    # Point size
    color_scheme: 'viridis'          # Color scheme
    
  # Animation settings
  animation:
    enabled: true                    # Enable training animation
    fps: 2                           # Frames per second
    format: 'gif'                    # 'gif', 'mp4', 'webm'
    duration: 10                     # Animation duration in seconds
    smooth_transitions: true         # Smooth interpolation between epochs
    
  # Comparison visualization
  comparison:
    enabled: true                    # Enable architecture comparison
    side_by_side: true               # Side-by-side comparison
    overlay_mode: false              # Overlay different architectures
    
# Analysis Settings
analysis:
  # Topology trajectory analysis
  trajectory:
    enabled: true                    # Enable trajectory analysis
    metrics:
      - 'betti_stability'            # Betti number stability
      - 'topology_distance'          # Distance between topologies
      - 'convergence_rate'           # Convergence rate
    
  # Architecture comparison
  architecture_comparison:
    enabled: true                    # Enable architecture comparison
    statistical_tests: true         # Perform statistical tests
    confidence_level: 0.95           # Confidence level for tests
    
  # Export settings
  export:
    save_topology_data: true         # Save topology data
    save_boundary_meshes: true       # Save boundary meshes
    save_analysis_results: true      # Save analysis results
    formats: ['pt', 'npz', 'ply']    # Export formats

# Output Settings
output:
  # Directory structure
  directories:
    base_dir: 'results/decision_boundary_analysis'
    boundaries_dir: 'boundaries'      # Boundary data subdirectory
    topology_dir: 'topology'          # Topology data subdirectory
    visualization_dir: 'visualizations' # Visualization subdirectory
    analysis_dir: 'analysis'          # Analysis results subdirectory
    
  # File naming
  naming:
    include_timestamp: true          # Include timestamp in filenames
    include_config_hash: false       # Include config hash in filenames
    boundary_prefix: 'boundary'      # Prefix for boundary files
    topology_prefix: 'topology'      # Prefix for topology files
    
  # Compression and storage
  storage:
    compress_data: true              # Compress saved data
    cleanup_temp_files: true         # Clean up temporary files
    save_intermediate: false         # Save intermediate computation steps

# Performance Settings
performance:
  # Memory management
  memory:
    max_memory_gb: 8.0               # Maximum memory usage in GB
    batch_processing: true           # Use batch processing for large grids
    batch_size: 10000                # Batch size for point processing
    
  # Parallel processing
  parallel:
    enabled: true                    # Enable parallel processing
    num_workers: null                # Number of workers (null = auto-detect)
    chunk_size: 1000                 # Chunk size for parallel processing
    
  # Optimization
  optimization:
    use_sparse_grids: true           # Use sparse grids for efficiency
    cache_predictions: true          # Cache network predictions
    precompute_distances: false      # Precompute distance matrices

# Debugging and Logging
debug:
  verbose: true                      # Verbose output
  save_debug_data: false             # Save debug information
  plot_intermediate_steps: false     # Plot intermediate steps
  log_memory_usage: true             # Log memory usage
  
# Experimental Features
experimental:
  # Advanced boundary detection
  advanced_boundary_detection:
    enabled: false                   # Enable experimental features
    gradient_based_refinement: false # Use gradients for boundary refinement
    uncertainty_sampling: false      # Sample based on prediction uncertainty
    
  # Topology computation
  advanced_topology:
    enabled: false                   # Enable experimental topology features
    persistent_images: false         # Compute persistence images
    wasserstein_distances: false     # Compute Wasserstein distances