# Network Homology Configuration
# Simplified configuration with only essential parameters and detailed option comments

network_homology:
  # Core settings
  enabled: true  # Options: true, false
  
  # Tracking and alignment settings
  alignment:
    mode: "step"  # Options: "epoch", "step"
                  # - "epoch": Track homology at the end of each epoch
                  # - "step": Track homology every N training steps (better temporal resolution)
    
    validation_interval: 500  # Track every N epochs/steps (depending on mode above)
                            # For epoch mode: 1 = every epoch, 2 = every 2 epochs, etc.
                            # For step mode: 50 = every 50 steps, 100 = every 100 steps, etc.
                            # Lower values = more measurements but slower training
    
    validation_method: "full"  # Options: "full", "quick"
                              # - "full": Use complete test set for validation (more accurate)
                              # - "quick": Use subset for faster validation during training
    
    quick_validation_samples: 256  # Number of samples for quick validation (when validation_method="quick")
                                  # Common values: 128, 256, 512
  
  # Graph construction settings
  graph_construction:
    normalize_weights: true  # Options: true, false
                            # - true: Normalize edge weights (recommended for homology)
                            # - false: Use raw weights (may cause numerical issues)
    
    weight_threshold: 0.000001  # Minimum weight magnitude to include edge
                                   # Common values: 0.000001, 0.00001, 0.0001
                                   # Lower = include more edges, higher = sparser graph
    
    weight_encoding: "reverse"  # Options: "standard", "mirror", "reverse"
                               # - "standard": Keep original edge direction and sign
                               # - "mirror": Split positive/negative weights with mirror nodes
                               # - "reverse": Reverse edges for negative weights (nn-evolution style)
    
    normalization_type: "nn_evolution"  # Options: "standard", "nn_similarity", "nn_evolution"
                                       # - "standard": Simple max normalization
                                       # - "nn_similarity": Distance formula from nn-similarity paper
                                       # - "nn_evolution": Formula from nn-evolution paper (recommended)
    
    min_edge_distance: 0.000001  # Minimum edge distance for normalization
                                     # Prevents division by zero in distance calculations
                                     # Common values: 0.000001, 0.00001
    
    include_bias: true  # Options: true, false
                       # - true: Include bias parameters as graph nodes
                       # - false: Exclude bias parameters (weights only)
  
  # Geodesic distance computation (nn-evolution style)
  geodesic_distance:
    enabled: true  # Options: true, false
                  # - true: Compute shortest path distances on graph (recommended for nn-evolution compatibility)
                  # - false: Use direct edge weights (faster but less accurate)
    
    backend: "graph-tool"  # Options: "graph-tool", "scipy", "auto"
                          # - "graph-tool": Fastest, requires graph-tool library
                          # - "scipy": Fallback using scipy.sparse
                          # - "auto": Automatically select best available
    
    directed: true  # Options: true, false
                   # - true: Treat graph as directed (information flow direction matters)
                   # - false: Undirected graph (bidirectional connections)
  
  # Simplicial complex settings
  simplicial_complex:
    max_dimension: 2  # Maximum homology dimension to compute
                     # Options: 0, 1, 2, 3, ...
                     # - 0: Only connected components (H0)
                     # - 1: Loops/cycles (H0, H1) - most common
                     # - 2: Voids/cavities (H0, H1, H2) - computationally expensive
                     # Higher dimensions = exponentially more computation
    
    max_edge_length: 1.0  # Maximum edge weight to include in complex
                         # After normalization, weights > this value are excluded
                         # Common values: 0.5, 1.0, 1.5
    
    backend: "gudhi"  # Options: "gudhi", "flagser", "auto"
                     # - "gudhi": General purpose, handles undirected complexes
                     # - "flagser": Optimized for directed flag complexes (if available)
                     # - "auto": Automatically select best available
    
    fallback_backend: "auto"  # Fallback if primary backend fails
                             # Options: "gudhi", "flagser", "auto"
  
  # Persistence computation
  persistence:
    backend: "auto"  # Options: "auto", "gudhi", "flagser"
                    # - "auto": Use same backend as simplicial complex
                    # - "gudhi": Force GUDHI for persistence computation
                    # - "flagser": Force Flagser for persistence computation
    
    epsilon_filtering: 0.6  # Filter edges with distance > epsilon (nn-evolution compatibility)
                           # Common values: 0.5, 0.6, 0.7
                           # Lower = more restrictive filtering
    
    max_edge_weight: 1.0  # Maximum edge weight constraint
                         # Used to replace infinite persistence values
                         # Should match max_edge_length above
    
    replace_infinity: true  # Options: true, false
                           # - true: Replace infinite persistence with max_edge_weight
                           # - false: Keep infinite values (may cause issues)
  
  # Distance metrics for homology comparison
  distance_metrics:
    primary_metric: "heat"  # Options: "heat", "wasserstein", "bottleneck", "silhouette"
                           # - "heat": Heat kernel distance (fast, good for correlation)
                           # - "wasserstein": Earth mover's distance (slower, more accurate)
                           # - "bottleneck": Maximum matching distance (robust to outliers)
                           # - "silhouette": Silhouette-based distance (nn-evolution style)
    
    heat_sigma: 0.1  # Heat kernel bandwidth parameter (when primary_metric="heat")
                    # Common values: 0.05, 0.1, 0.2
                    # Lower = more sensitive to small features
  
  # Tracking settings for memory optimization
  tracking:
    incremental_only: true  # Options: true, false
                           # - true: Only compare consecutive network states (memory efficient)
                           # - false: Compare with all previous states (memory intensive)
    
    store_full_diagrams: false  # Options: true, false
                               # - true: Store complete persistence diagrams (large memory usage)
                               # - false: Store only distance metrics (recommended)
    
    store_synchronized_data: true  # Options: true, false
                                  # - true: Store perfectly aligned homology-validation pairs
                                  # - false: Don't store synchronized data
  
  # Correlation analysis settings
  correlation_analysis:
    use_cumulative_distances: true  # Options: true, false
                                   # - true: Use cumulative sum of distances (nn-evolution style)
                                   # - false: Use raw distance values
    
    use_raw_validation: true  # Options: true, false
                             # - true: Use raw validation accuracy values (nn-evolution style)
                             # - false: Use cumulative validation accuracy
    
    method: "pearson"  # Options: "pearson", "spearman", "kendall"
                      # - "pearson": Linear correlation (most common)
                      # - "spearman": Rank correlation (robust to outliers)
                      # - "kendall": Tau correlation (robust, slower)
    
    use_nn_evolution_correlation: true  # Options: true, false
                                       # - true: Use exact nn-evolution correlation methodology
                                       #   (cumulative distances + raw validation accuracy)
                                       # - false: Use standard correlation approach
  
  # Visualization settings
  visualization:
    enabled: false  # Options: true, false
                  # - true: Generate network graph visualizations
                  # - false: Skip visualization generation (faster training)
    
    create_static_graph: true  # Options: true, false
                              # - true: Create PNG image of network graph
                              # - false: Skip static graph generation
    
    create_interactive_graph: true  # Options: true, false
                                   # - true: Create interactive HTML graph visualization
                                   # - false: Skip interactive graph generation
    
    static_format: "png"  # Options: "png", "pdf", "svg"
                         # - "png": Raster image (good for viewing)
                         # - "pdf": Vector format (good for publications)
                         # - "svg": Scalable vector (good for web)
    
    static_dpi: 300  # Resolution for static images (when format is "png")
                    # Common values: 150 (screen), 300 (print), 600 (high-res)
    
    interactive_format: "html"  # Options: "html"
                               # - "html": Standalone HTML file with embedded JavaScript
  
  # Output settings
  output:
    base_dir: "results/network_homology"  # Directory for saving results
                                         # Can be absolute or relative path
    
    save_synchronized_data: true  # Options: true, false
                                 # - true: Save perfectly aligned data for analysis
                                 # - false: Don't save synchronized data
    
    synchronized_data_format: "csv"  # Options: "csv", "json", "pickle"
                                    # - "csv": Human-readable, works with Excel/pandas
                                    # - "json": Structured text format
                                    # - "pickle": Python binary format (smallest file size)